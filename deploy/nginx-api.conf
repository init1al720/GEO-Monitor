# 后端 API 站点。前端在 Vercel，所以这里只提供 api.<域名>，不托管前端静态文件。
# 放到 /etc/nginx/sites-available/geo-api，然后 ln -s 到 sites-enabled。
server {
    listen 80;
    server_name api.geo.example.com;

    # 采集接口是异步的，但 /runs 轮询和重算指标可能慢，给足超时
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # 只放行健康检查，其余路径一律 404：这台机器只对外提供 API
    location = /health {
        proxy_pass http://127.0.0.1:8000/api/v1/health;
    }

    location / {
        return 404;
    }

    client_max_body_size 8m;
    gzip on;
    gzip_types application/json;
}
